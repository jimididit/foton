name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: Pester
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester 5
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      # Frozen 1.38.x line (parity oracle for the C# port). Job name stays "Pester": it is a required check.
      - name: Run Foton tests (legacy PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\legacy\powershell\tests\Invoke-FotonTests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Foton v2 (C#). Builds net462 executables with the SDK pinned in global.json.
  dotnet:
    name: dotnet
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build (Release, warnings as errors)
        run: dotnet build Foton.sln -c Release -warnaserror

      # Includes the architecture tests: layer rules, P/Invoke only in Foton.Win,
      # no in-memory assembly loading, and one exe per role with no loose DLLs.
      - name: Test
        run: dotnet test Foton.sln -c Release --no-build

      - name: Vulnerable packages
        shell: pwsh
        run: |
          # Merged stderr is deliberate (one log), but a failed listing must not read as "no vulnerabilities".
          $out = dotnet list Foton.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "dotnet list package --vulnerable failed (exit $code)." }
          if ($out -match 'has the following vulnerable packages') { throw 'A vulnerable NuGet package is referenced.' }
