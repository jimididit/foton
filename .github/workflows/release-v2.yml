name: Release v2

# Foton 2 and later (C#). Tag vX.Y.Z or vX.Y.Z-<prerelease> (matching FotonVersion / FotonPrerelease in
# Directory.Build.props) to publish. A tag with a prerelease suffix publishes a GitHub prerelease.
# The release's "What's new" is the CHANGELOG.md section for that version; the build fails without one.
# Run manually (workflow_dispatch) for a dry run: builds, tests, and uploads the executables as a
# workflow artifact without creating a release.
#
# Same split as release.yml: `build` runs repository code with a read-only token; `publish` runs no
# repository code and only verifies, attests, and releases the exact files `build` uploaded.
# Executables are not Authenticode-signed yet (deferred until public use); provenance attestation
# and SHA256SUMS.txt are the integrity story until then. Each release also carries Foton-<version>-windows.zip
# (the four executables, their SHA256SUMS.txt, LICENSE.txt, packaging\README.txt), hashed and attested like them.
# Actions are pinned to commit SHAs (tag in the trailing comment).

on:
  push:
    tags: ['v2.*', 'v3.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $p = ([xml](Get-Content -Raw .\Directory.Build.props)).Project.PropertyGroup | Where-Object { $_.FotonVersion } | Select-Object -First 1
          $ver = [string]$p.FotonVersion
          if ([string]$p.FotonPrerelease) { $ver = "$ver-$($p.FotonPrerelease)" }
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $ver in Directory.Build.props."
          }

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = ([xml](Get-Content -Raw .\Directory.Build.props)).Project.PropertyGroup | Where-Object { $_.FotonVersion } | Select-Object -First 1
          $ver = [string]$p.FotonVersion
          if ([string]$p.FotonPrerelease) { $ver = "$ver-$($p.FotonPrerelease)" }
          $lines = Get-Content .\CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$ver] - ") })
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$ver]' section." }
          $end = [array]::FindIndex([string[]]$lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith('## ') })
          if ($end -lt 0) { $end = $lines.Count }
          if ($end -le $start + 1) { throw "CHANGELOG.md section $ver is empty." }
          # Demote the changelog's ### headings under the release's "What's new" heading.
          $body = $lines[($start + 1)..($end - 1)] | ForEach-Object { $_ -replace '^### ', '#### ' }
          if (-not ($body -join '').Trim()) { throw "CHANGELOG.md section $ver is empty." }
          $out = New-Item -ItemType Directory -Force -Path 'dist\release-v2-notes'
          [IO.File]::WriteAllText((Join-Path $out 'changes.md'), (($body -join "`n").Trim() + "`n"))

      - name: Build (Release, warnings as errors)
        run: dotnet build Foton.sln -c Release -warnaserror

      - name: Test
        run: dotnet test Foton.sln -c Release --no-build

      - name: Stage executables and the all-in-one ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = ([xml](Get-Content -Raw .\Directory.Build.props)).Project.PropertyGroup | Where-Object { $_.FotonVersion } | Select-Object -First 1
          $ver = [string]$p.FotonVersion
          if ([string]$p.FotonPrerelease) { $ver = "$ver-$($p.FotonPrerelease)" }
          $out = New-Item -ItemType Directory -Force -Path 'dist\release-v2'
          Copy-Item 'cli\Foton.Collect.Cli\bin\Release\net462\foton-collect.exe' $out
          Copy-Item 'cli\Foton.Baseline.Cli\bin\Release\net462\foton-baseline.exe' $out
          Copy-Item 'cli\Foton.Cli\bin\Release\net462\foton.exe' $out
          Copy-Item 'cli\Foton.Gui\bin\Release\net462\foton-console.exe' $out
          $sums = Get-ChildItem $out -Filter *.exe | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # One download for most people: the four executables, their SHA256SUMS.txt, LICENSE, and a README, in one
          # folder. The same executables stay attached on their own (RMM, scripts).
          $name = "Foton-$ver-windows"
          $stage = New-Item -ItemType Directory -Force -Path (Join-Path 'dist\zip' $name)
          Copy-Item (Join-Path $out '*.exe') $stage
          [IO.File]::WriteAllLines((Join-Path $stage 'SHA256SUMS.txt'), [string[]]$sums)
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE.txt')
          $readme = (Get-Content -Raw -Encoding UTF8 'packaging\README.txt').Replace('{VERSION}', $ver) -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText((Join-Path $stage 'README.txt'), $readme, (New-Object System.Text.UTF8Encoding $false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $out "$name.zip"
          # Files at the root: Explorer's Extract All already makes a folder named after the ZIP.
          [IO.Compression.ZipFile]::CreateFromDirectory($stage.FullName, (Join-Path (Resolve-Path $out) "$name.zip"), [IO.Compression.CompressionLevel]::Optimal, $false)
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums += '{0}  {1}' -f $zipSha, "$name.zip"
          [IO.File]::WriteAllLines((Join-Path $out 'SHA256SUMS.txt'), [string[]]$sums)
          Get-Content (Join-Path $out 'SHA256SUMS.txt')
          # The release statement the owner signs offline (packaging\sign-release.ps1) and the console's updater trusts
          # only with that signature. Written by hand so the signed bytes are stable: fixed key order, LF, no BOM.
          $files = Get-ChildItem $out -Filter *.exe | Sort-Object Name | ForEach-Object {
            '    "{0}": "{1}"' -f $_.Name, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $statement = @(
            '{'
            '  "product": "Foton",'
            ('  "version": "{0}",' -f $ver)
            ('  "released": "{0}",' -f [string]$p.FotonReleaseDate)
            ('  "zip": {{ "name": "{0}", "sha256": "{1}" }},' -f "$name.zip", $zipSha)
            '  "files": {'
            ($files -join ",`n")
            '  }'
            '}'
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $out 'foton-release.json'), $statement + "`n", (New-Object System.Text.UTF8Encoding $false))
          Get-Content (Join-Path $out 'foton-release.json')

      - name: Upload executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foton-v2-release
          if-no-files-found: error
          path: |
            dist/release-v2/*.exe
            dist/release-v2/*.zip
            dist/release-v2/SHA256SUMS.txt
            dist/release-v2/foton-release.json

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foton-v2-notes
          if-no-files-found: error
          path: dist/release-v2-notes/changes.md

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foton-v2-release
          path: assets

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foton-v2-notes
          path: notes

      - name: Verify SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path assets).Path
          foreach ($line in Get-Content (Join-Path $dir 'SHA256SUMS.txt')) {
            $hash, $leaf = $line -split '  ', 2
            $actual = (Get-FileHash (Join-Path $dir $leaf) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "Hash mismatch for $leaf" }
          }
          "ASSET_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.exe
            assets/*.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $pre = @()
          $preNote = ''
          if ($tag.Contains('-')) {
            $pre = @('--prerelease')
            $preNote = "`n`n**Prerelease** for testing; not supported. Use the latest release for casework."
          }
          $changes = (Get-Content -Raw -Encoding UTF8 'notes\changes.md').Trim()
          $zipFile = Get-ChildItem $env:ASSET_DIR -Filter 'Foton-*-windows.zip' | Select-Object -First 1
          if (-not $zipFile) { throw 'The all-in-one ZIP is missing from the release assets.' }
          $zipName = $zipFile.Name
          $zipSha = (Get-FileHash $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          ## Foton $tag

          Single-file executables on in-box .NET Framework 4.6.2+ (Windows 10 / Server 2016 and newer). Nothing to install.$preNote

          **Download ``$zipName``**: all four executables, their ``SHA256SUMS.txt``, ``LICENSE.txt``, and a ``README.txt``, in one folder. Its SHA-256 is ``$zipSha``. The executables are also attached on their own, for RMM and scripts.

          - **foton-collect.exe**: live triage into a hashed case package (custody, coverage, manifest, findings, ``Foton_Report.html``, ZIP). Same switches as the 1.38.x Collect flat script. Administrator preferred; standard user supported.
          - **foton-baseline.exe**: capture a baseline of stable configuration (37 record types) into a hashed package with ``Foton_Baseline.html``. Same switches as the 1.38.x flat script: ``-OutputPath``, ``-Path``, ``-NoZip``, ``-NoHtml``, ``-RequireAdministrator``.
          - **foton.exe**: workstation verbs ``compare``, ``parse``, ``analyze``, ``ioc``, ``compose``, ``tools``, ``carve``, ``timeline``, ``notes``, ``search``, ``handoff``, ``bundle`` (build a collector bundle for an endpoint), ``cases`` (list packages), and ``package`` (verify hashes). Carries the two collectors for ``bundle``.
          - **foton-console.exe**: a workstation window for the same work: open a package or ZIP, verify, parse, compose, analyze, read findings and artifacts, match IOCs, install and pick external tools, compare baselines, build collection profiles, and build collection and baseline bundles for endpoints with the collectors it carries. Never runs a collector or touches the live host.

          Each executable prints its version and schemas with ``-Version``. Compare accepts baselines from Foton 1.38.x (schema 1.14.0) onward and explains the one-time format and coverage differences; see [Formats and compatibility](https://github.com/jimididit/foton/blob/$tag/docs/USAGE.md#formats-and-compatibility).

          Hosts older than Windows 10 / Server 2016: use [Foton 1.38.2](https://github.com/jimididit/foton/releases/tag/v1.38.2) (PowerShell; final release, no longer maintained). Operator guide: [docs/USAGE.md](https://github.com/jimididit/foton/blob/$tag/docs/USAGE.md).

          ## What's new in $tag
          $changes

          Full history: [CHANGELOG.md](https://github.com/jimididit/foton/blob/$tag/CHANGELOG.md).

          ## Verify before use
          The executables are not Authenticode-signed yet, so Windows SmartScreen may warn on first run. Check the ZIP's hash and build provenance, then unblock it before extracting (what you extract then carries no download mark):
          ``````powershell
          Get-FileHash .\$zipName -Algorithm SHA256   # compare with the SHA-256 above
          gh attestation verify .\$zipName --repo $env:GITHUB_REPOSITORY
          Unblock-File .\$zipName
          ``````
          A single executable checks the same way against its line in ``SHA256SUMS.txt``.

          ``foton-release.json`` lists this release's files and hashes for the console's updater; the updater installs nothing until the maintainer's offline signature, ``foton-release.json.sig``, is attached.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8
          $files = @(Get-ChildItem $env:ASSET_DIR -File | ForEach-Object FullName)
          gh release create $tag @files @pre --repo $env:GITHUB_REPOSITORY --title "Foton $tag" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
