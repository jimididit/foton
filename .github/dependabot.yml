version: 2
updates:
  # Workflows pin actions to commit SHAs; this opens a PR when a pinned action releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Build- and test-time NuGet packages (nothing ships inside the executables).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
